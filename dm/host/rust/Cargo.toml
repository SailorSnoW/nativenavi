# The host's Rust code (docs/development.md, "Rust in the host"): one static library that dm/host/rust.mk builds and dm/host/Makefile links into the host.
# No crate from outside the repository: the build runs with --locked --offline, so it needs no network and pulls in no code nobody here read.
[package]
name = "dmhost_rs"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
opt-level = 2                 # as the host's C (dm/host/Makefile CFLAGS)
debug = "line-tables-only"    # files and lines in crash reports and in the host's dSYM
panic = "abort"               # never unwind into the C or the game's frames
overflow-checks = true        # an overflow nobody meant stops the host where it happens instead of wrapping on; every sum here is bounded (the tests take the extremes)
codegen-units = 1
lto = "fat"                   # one object of what the exported functions reach, core included: without it the link took whole members of core (float and IPv6 formatting...), 0.13 MB of code nothing calls. Not the C host's -flto, which dm/host/Makefile keeps off
incremental = false

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_code = "deny"            # allowed only in the modules that talk to C (src/lib.rs names them)
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"   # every unsafe block says why it holds (// SAFETY:)
