name: Rust
description: The Rust that dm/host/rust/rust-toolchain.toml names (the host links a Rust library), with rustup if the image has none
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if ! command -v rustup > /dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        cd dm/host/rust && rustup toolchain install && cargo --version
