# ruff (bug rules, no formatting) and pyright (basic) over scripts/ and dm/ tools (pyproject.toml), as a ratchet on dm/tools/lint_python_baseline.tsv: it fails on a new
# finding, on a fixed one still listed (`dm/tools/lint_python.py --update`), and on a pull request whose baseline grew over its base's. ty runs beside it, advisory only.
name: lint-python

on:
  pull_request:
    paths: ['**.py', pyproject.toml, .github/requirements/lint.txt, .github/requirements/tools.txt, .github/workflows/lint-python.yml, dm/tools/lint_python_baseline.tsv]
  push:
    branches: [main]
    paths: ['**.py', pyproject.toml, .github/requirements/lint.txt, .github/requirements/tools.txt, .github/workflows/lint-python.yml, dm/tools/lint_python_baseline.tsv]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: ruff and pyright (ratchet)
    runs-on: ubuntu-24.04   # pyproject.toml fixes the platform pyright assumes (Darwin), so the findings match a Mac's
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            .github/requirements/lint.txt
            .github/requirements/tools.txt
      - name: Install the pinned tools and the packages the tools import
        run: python -m pip install -r .github/requirements/lint.txt -r .github/requirements/tools.txt
      - name: Base branch's baseline (pull requests)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
      - name: ruff and pyright against the baseline
        run: python dm/tools/lint_python.py ${{ github.event_name == 'pull_request' && '--against FETCH_HEAD' || '' }}
