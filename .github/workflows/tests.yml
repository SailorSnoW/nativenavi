# Tests that need no game files, keys or GPU. GitHub's macOS runners have no Metal 4, so the tests that go through mtl_init stay local
# (`make -C dm/gfx/tests GAME=<id> run` on an Apple-silicon Mac).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A push to main never cancels: pushes come faster than a run finishes, so cancelling would leave main with no finished run. Only the newest push waits behind it.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The supported Xcode, named by path so a change of the image's default does not move CI; test_ci_toolchain.py keeps it in step with README and the image
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  GAME: 0400486024DEC000   # the profile the host and gfx tests are built for

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment): a tag can be moved, a SHA cannot.
jobs:
  host:
    name: Host, Rust and CPU-only gfx tests, Mac host build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected Xcode's Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain   # a separate component, not included in the xcode-27 image
      - name: Toolchain (Xcode and the Metal compiler of dmsh_chain.lock)
        run: |
          xcodebuild -version
          xcrun metal --version
          python3 dm/gfx/tools/own_compilers.py --check-metal
      - uses: ./.github/actions/rust
      # Miri (cargo +nightly miri test) stays local: a nightly that moves would make this job fail for no change here
      - name: Rust unit tests and lints (dm/host/rust)
        working-directory: dm/host/rust
        run: |
          rustup component add clippy rustfmt
          cargo test --locked --offline
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo clippy --locked --offline --release --target aarch64-apple-darwin -- -D warnings
          cargo fmt --check
      - name: Mac host
        run: |
          mkdir -p logs
          make -C dm/host GAME="$GAME" -j3 dmhost 2>&1 | tee logs/dmhost.log
          test -x dm/host/dmhost
      - name: Host unit tests (dm/host/tests)
        run: make -C dm/host/tests GAME="$GAME" -j3 run 2>&1 | tee logs/host-tests.log
      - name: CPU texture layout and deswizzle test (dm/gfx/tex/tests)
        run: |
          make -C dm/gfx/tex/tests t_tex 2>&1 | tee logs/texture-tests.log
          dm/gfx/tex/tests/t_tex 2>&1 | tee -a logs/texture-tests.log
      - name: CPU-only gfx tests (dm/gfx/tests cpu-run)
        run: make -C dm/gfx/tests GAME="$GAME" -j3 cpu-run 2>&1 | tee logs/gfx-cpu.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-host
          path: logs
          retention-days: 7

  # Known fixture and framework exceptions are in dm/sanitizers; a new host finding fails the job.
  sanitizers:
    name: Sanitizers (ASan, UBSan and TSan over the host, texture and CPU gfx tests)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Registration sections (all producers, ASan and UBSan, no global ignorelist)
        run: |
          mkdir -p logs
          make -C dm/gfx/tests GAME="$GAME" registration-asan 2>&1 | tee logs/registration-asan.log
      - name: ASan and UBSan, every host unit test (dm/host/tests)
        run: make -C dm/host/tests GAME="$GAME" -j3 asan 2>&1 | tee logs/host-asan.log
      - name: ASan and UBSan, CPU texture layout and deswizzle test (dm/gfx/tex/tests)
        run: make -C dm/gfx/tex/tests asan 2>&1 | tee logs/texture-asan.log
      - name: ThreadSanitizer, the host tests (audio, HID, guest memory and every test that starts threads)
        run: make -C dm/host/tests GAME="$GAME" -j3 tsan memory-tsan tsan-threads 2>&1 | tee logs/host-tsan.log
      - name: ThreadSanitizer, the CPU gfx tests (dm/gfx/tests cpu-tsan)
        run: make -C dm/gfx/tests GAME="$GAME" -j3 cpu-tsan 2>&1 | tee logs/gfx-tsan.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-sanitizers
          path: logs
          retention-days: 7

  tools:
    name: Tool and translator tests
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected Xcode's Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements/tools.txt
      - name: Install the Python packages the tools import
        run: python -m pip install -r .github/requirements/tools.txt
      # The translator tests run the committed translator on synthetic shaders, then spirv-val and spirv-cross; their Metal compile (DMSH_TEST_METAL=1)
      # and GPU run (DMSH_TEST_GPU=1) stay local.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'   # the translator is native; some of its tests build their fixtures with .NET
      - name: Install spirv-val   # spirv-cross is the in-repo build (dm/gfx/tools/spirv_cross_bin)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install spirv-tools
      - name: Run the test files
        env:
          DM_GAME: ${{ env.GAME }}   # test_tbdr_budget runs a tool that needs a profile
          DMSH_TEST_XLATE: ${{ github.workspace }}/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate
        run: |
          mkdir -p logs
          failed=0
          for f in dm/tools/tests/test_*.py dm/gfx/tests/test_*.py; do
            echo "::group::$f"
            python -m unittest -v "$f" 2>&1 | tee "logs/$(basename "$f").log" || { echo "::error::$f failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-tools
          path: logs
          retention-days: 7

  # Report only: no threshold fails it, and a failing test is the other jobs' to report, so the runs here keep going.
  coverage:
    name: Coverage (host, CPU texture and tool tests; report only)
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # HEAD^1 is the base the diff coverage compares with
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            .github/requirements/coverage.txt
            .github/requirements/tools.txt
      - name: Install coverage.py and the packages the tools import
        run: python -m pip install -r .github/requirements/coverage.txt -r .github/requirements/tools.txt
      - uses: ./.github/actions/rust
      - name: Host unit tests (dm/host/tests), llvm-cov
        continue-on-error: true
        run: |
          mkdir -p coverage
          make -C dm/host/tests GAME="$GAME" -j3 coverage 2>&1 | tee coverage/host.log
          cp dm/host/tests/build/cov/coverage.lcov coverage/host.lcov
      - name: CPU texture layout and deswizzle test (dm/gfx/tex/tests), llvm-cov
        continue-on-error: true
        run: |
          mkdir -p coverage
          make -C dm/gfx/tex/tests coverage 2>&1 | tee coverage/textures.log
          cp dm/gfx/tex/tests/cov/coverage.lcov coverage/textures.lcov
      - name: Tool tests (dm/tools/tests), coverage.py
        continue-on-error: true
        env:
          DM_GAME: ${{ env.GAME }}
        run: |
          mkdir -p coverage
          for f in dm/tools/tests/test_*.py; do
            echo "::group::$f"
            python -m coverage run -m unittest "$f" 2>&1 | tee -a coverage/python.log || echo "::warning::$f failed (the tools job reports it)"
            echo "::endgroup::"
          done
          python -m coverage combine -q
          python -m coverage json -q -o coverage/python.json
      - name: Summary (diff coverage against the previous commit)
        run: |
          args=(--base HEAD^1)
          for f in coverage/host.lcov coverage/textures.lcov coverage/python.json; do [ -f "$f" ] && a=${f#coverage/} && args+=("--${a%.*}" "$f"); done
          python dm/tools/coverage_report.py "${args[@]}" | tee coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  gfx-build:
    name: Every gfx test compiled, not run
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected Xcode's Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - uses: ./.github/actions/rust
      - name: Every gfx test compiled, not run
        run: |
          mkdir -p logs
          cd dm/gfx/tests
          tests=$(sed -n 's/^\(t_[a-z0-9_]*\):.*/\1/p' Makefile | sort -u)
          echo "$tests" | tr '\n' ' '; echo
          # shellcheck disable=SC2086   # one target per word
          make GAME="$GAME" -j3 $tests 2>&1 | tee ../../../logs/gfx-tests-build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-gfx-build
          path: logs
          retention-days: 7
